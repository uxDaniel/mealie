name: Build fork image

on:
  push:
    tags:
      - "v*-dan.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Upstream writes the version into the package the same way in build-package.yml.
      - name: Set the app version
        run: echo "__version__ = \"${GITHUB_REF_NAME}\"" > mealie/__init__.py

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/uxdaniel/mealie:${{ github.ref_name }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
